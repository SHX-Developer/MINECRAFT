services:
  shx-craft:
    build:
      context: .
      dockerfile: Dockerfile
    image: shx-craft:latest
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
