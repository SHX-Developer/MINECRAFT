server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location ~ /\.(?!well-known) {
    deny all;
  }

  location ~* \.(?:html|css|js|mjs)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location ~* \.(?:png|jpg|jpeg|gif|webp|ico|mp3|wav|ogg)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
